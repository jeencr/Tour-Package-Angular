
<br><br><br><br><div align="center"><div class="card text-center w-50">
    <div class="card-body">
        <h4 class="card-title">Provider Register</h4>
        
        <div>
            <div class="form-floating mb-3">
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="username"
                    placeholder=""
                />
                <label for="formId1">Username</label>
            </div>

             <div class="form-floating mb-3">
                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="password"
                    placeholder=""
                />
                <label for="formId1">Password</label>
            </div>

            
            <div class="form-floating mb-3">
                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="email"
                    placeholder=""
                />
                <label for="formId1">Email</label>
            </div>

            <div class="form-floating mb-3">
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="company_name"
                    placeholder=""
                />
                <label for="formId1">Company Name</label>
            </div>
            
            <div class="form-floating mb-3">
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="phone"
                    placeholder=""
                />
                <label for="formId1">phone</label>
            </div>

            
            <div class="form-floating mb-3">
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="place"
                    placeholder=""
                />
                <label for="formId1">Place</label>
            </div>

            
            <div class="form-floating mb-3">
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="district"
                    placeholder=""
                />
                <label for="formId1">District</label>
            </div>
            
            <button
                type="submit"
                class="btn btn-primary"
                (click)="register_provider()"
            >
                Submit
            </button>
            


        </div>

    </div>
</div>
</div>
