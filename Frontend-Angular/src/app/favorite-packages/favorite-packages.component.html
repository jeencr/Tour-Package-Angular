<div class="container mt-5">
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let p of fav_packages">

      <div class="card h-100 shadow">
        <img
          *ngIf="p.package_details.images.length > 0"
          [src]="'http://127.0.0.1:8000' + p.package_details.images[0].image"
          class="card-img-top"
          style="height: 250px; object-fit: cover"
        />

        <div class="card-body">

          <h4>
            {{ p.package_details.package_name }}
          </h4>


          <p>
            {{ p.package_details.destination_name }}
          </p>

          <h5>₹ {{ p.package_details.amount }}</h5>

          <a [routerLink]="['/package-details', p.package_details.id]" class="btn btn-primary">
            View Package
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
